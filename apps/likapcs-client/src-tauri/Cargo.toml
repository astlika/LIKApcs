[package]
name = "likapcs-client"
version = "0.37.0"
description = "LIKApcs-Client — lock screen, session timer and remote control agent for gaming PCs"
authors = ["LIKApcs"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "likapcs_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
# 0.35.4: the window layer is kept at fixed versions. The repository has no Cargo.lock, so every
# build took the newest Tauri, tao and wry of that day: a new one could change how a window
# behaves next to a game without a line of this crate changing. These are the versions 0.35.3 was
# built with (2026-11-15). Raise them on purpose, together, and try the result on a gaming PC.
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-runtime = { version = "=2.12.2", default-features = false }
tauri-runtime-wry = { version = "=2.12.3", default-features = false }
tauri-utils = { version = "=2.10.2", default-features = false }
tao = { version = "=0.37.2", default-features = false }
wry = { version = "=0.57.2", default-features = false }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Hardware facts + live load for the Admin's PC details (CPU, GPU names via WMI, RAM, disk, sensors).
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk", "component"] }
# Live screen (remote view): JPEG encoder for one frame at a time, and base64 for the frame payload.
jpeg-encoder = "0.6"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
# Device token and pairing data live in the Windows Credential Manager (DPAPI, per user).
keyring = { version = "3", features = ["windows-native"] }
# Low-level keyboard hook for the lock screen (src/kiosk.rs).
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
