[package]
name = "likapcs-client"
version = "0.4.0"
description = "LIKApcs-Client — lock screen, session timer and remote control agent for gaming PCs"
authors = ["LIKApcs"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "likapcs_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Device token and pairing data live in the Windows Credential Manager (DPAPI, per user).
keyring = { version = "3", features = ["windows-native"] }
# Low-level keyboard hook for the lock screen (src/kiosk.rs).
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
