[package]
name = "likapcs-client"
version = "0.2.1"
description = "LIKApcs-Client — lock screen, session timer and remote control agent for gaming PCs"
authors = ["LIKApcs"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "likapcs_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Device token and pairing data live in the Windows Credential Manager (DPAPI, per user).
keyring = { version = "3", features = ["windows-native"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
