<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LIKApcs</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0f17;
        color: #334155;
        font-family: 'Segoe UI', system-ui, sans-serif;
        display: grid;
        place-items: center;
        cursor: none;
        user-select: none;
        overflow: hidden;
      }
      .mark {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 18px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.6;
      }
      .mark b {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #6366f1, #22d3ee);
        color: #fff;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <!-- Shown on secondary monitors while the PC is locked; it has no scripts and no controls. -->
    <div class="mark"><b>L</b> LIKApcs</div>
  </body>
</html>
