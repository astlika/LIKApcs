[package]
name = "likapcs-admin"
version = "0.35.4"
description = "LIKApcs Admin — POS, ERP and Gaming Station control"
authors = ["LIKApcs"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "likapcs_admin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
# 0.35.4: the window layer is kept at fixed versions. The repository has no Cargo.lock, so every
# build took the newest Tauri, tao and wry of that day: a new one could change how a window
# behaves next to a game without a line of this crate changing. These are the versions 0.35.3 was
# built with (2026-11-15). Raise them on purpose, together, and try the result on a gaming PC.
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-runtime = { version = "=2.12.2", default-features = false }
tauri-runtime-wry = { version = "=2.12.3", default-features = false }
tauri-utils = { version = "=2.10.2", default-features = false }
tao = { version = "=0.37.2", default-features = false }
wry = { version = "=0.57.2", default-features = false }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
