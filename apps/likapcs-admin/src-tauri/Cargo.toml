[package]
name = "likapcs-admin"
version = "0.1.0"
description = "LIKApcs Admin — POS, ERP and Gaming Station control"
authors = ["LIKApcs"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "likapcs_admin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
