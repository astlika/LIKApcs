# Temporary: hands the logs of two check runs over to the workspace as git blobs.
# Removed again in the next commit.
name: Live app hand-over (temporary)

on:
  push:
    paths: ['.github/workflows/live-apk-handover.yml']

permissions:
  contents: write
  actions: read

jobs:
  handover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hand over
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          for RUN in 43331592429 43331590477; do
            mkdir -p "art/$RUN"
            gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --dir "art/$RUN" || true
            for f in art/$RUN/*/phone/phone-check.log art/$RUN/*/phone/logcat.txt; do
              [ -f "$f" ] || continue
              sha=$(base64 -w0 "$f" | jq -Rs '{content: ., encoding: "base64"}' | gh api "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq .sha)
              echo "::notice title=handover::$RUN $(basename "$f") $sha $(stat -c %s "$f")"
            done
          done
