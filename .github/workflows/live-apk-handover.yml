# Temporary: hands the logs of one check run over to the workspace as git blobs.
# Removed again in the next commit.
name: Live app hand-over (temporary)

on:
  push:
    paths: ['.github/workflows/live-apk-handover.yml']

permissions:
  contents: write
  actions: read

jobs:
  handover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hand over
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          RUN=43493951275
          mkdir -p art
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --dir art || true
          for f in art/*/phone/phone-check.log art/*/phone/logcat.txt art/*/phone/logcat-before-restart.txt art/*/server.log; do
            [ -f "$f" ] || continue
            sha=$(base64 -w0 "$f" | jq -Rs '{content: ., encoding: "base64"}' | gh api "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq .sha)
            echo "::notice title=handover::$(basename "$f") $sha $(stat -c %s "$f")"
          done
