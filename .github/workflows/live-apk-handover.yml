# TEMPORARY (removed again right away): hands the published APK to a place that can be read
# through the GitHub API.
name: Live app hand-over (temporary)

on:
  push:
    branches: ['arena/5771f5db-likapcs']
    paths: ['.github/workflows/live-apk-handover.yml']

permissions:
  contents: write

jobs:
  handover:
    runs-on: ubuntu-latest
    steps:
      - name: The APK of release likalivepcs-v1.0.0 as a git blob
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: likalivepcs-v1.0.0
          FILE: likalivepcs-1.0.0.apk
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$FILE" --dir asset
          f="asset/$FILE"
          test -f "$f"
          base64 -w0 "$f" | jq -Rs '{encoding:"base64",content:.}' > body.json
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/blobs" --input body.json --jq .sha)
          echo "::notice title=handover::$FILE size=$(stat -c %s "$f") sha256=$(sha256sum "$f" | cut -d' ' -f1) blob=$sha"
