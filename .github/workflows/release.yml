# Release pipeline — triggered by a SemVer tag (v1.2.3). Publishes a GitHub release that contains
# exactly two files, so nobody has to guess what to download:
#   • LIKApcs-Setup.exe          main PC — Admin app + LIKApcs Server (embedded PostgreSQL)
#   • LIKApcs-Client-Setup.exe   every gaming PC
# Both are built from the same tag and carry the same version; the server only accepts clients of
# the same major version and the Admin "Updates" page pushes client updates.
#
# Everything the auto-updater needs is published to the `release-feed` branch instead of the release
# page: latest.json (Admin), latest-client.json (Client) — each with the installer URL and its
# minisign signature — plus SHA256SUMS.txt. The apps read
# https://raw.githubusercontent.com/<owner>/LIKApcs/release-feed/latest(.json|-client.json).
# The server bundle (likapcs-server-<ver>.zip) stays a workflow artifact for manual deployments.
#
# Required secret: TAURI_SIGNING_PRIVATE_KEY (minisign private key used for update signatures;
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD only if the key has one). Authenticode code signing of the
# installer is not configured yet (Windows SmartScreen shows "More info → Run anyway" on first install).
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

env:
  NODE_VERSION: 20
  PNPM_VERSION: 9.15.9

jobs:
  verify:
    name: Verify tag, versions and changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - id: v
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          ROOT=$(node -p "require('./package.json').version")
          ADMIN=$(node -p "require('./apps/likapcs-admin/package.json').version")
          CLIENT=$(node -p "require('./apps/likapcs-client/package.json').version")
          SERVER=$(node -p "require('./apps/likapcs-server/package.json').version")
          CARGO=$(grep -m1 '^version' apps/likapcs-admin/src-tauri/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          CARGO_CLIENT=$(grep -m1 '^version' apps/likapcs-client/src-tauri/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "tag=$VERSION root=$ROOT admin=$ADMIN client=$CLIENT server=$SERVER cargo=$CARGO cargo-client=$CARGO_CLIENT"
          for v in "$ROOT" "$ADMIN" "$CLIENT" "$SERVER" "$CARGO" "$CARGO_CLIENT"; do
            if [ "$v" != "$VERSION" ]; then echo "::error::package version $v does not match tag $VERSION"; exit 1; fi
          done
          grep -q "## \[$VERSION\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no entry for $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  server-bundle:
    name: Server bundle
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @likapcs/shared test
      - run: pnpm --filter @likapcs/server build
      - name: Assemble bundle
        run: |
          VERSION=${{ needs.verify.outputs.version }}
          OUT=likapcs-server-$VERSION
          mkdir -p $OUT/database
          cp -r apps/likapcs-server/dist $OUT/
          cp -r database/migrations $OUT/database/
          cp -r apps/likapcs-server/deploy $OUT/deploy
          cp .env.example $OUT/.env.example
          cp docs/development-setup.md $OUT/DEVELOPMENT.md
          cp apps/likapcs-server/deploy/README.md $OUT/README.md
          # Production package.json: runtime dependencies only (the shared package is bundled by tsup).
          node -e '
            const src = require("./apps/likapcs-server/package.json");
            delete src.dependencies["@likapcs/shared"];
            const out = { name: src.name, version: src.version, private: true, type: src.type, description: src.description,
              engines: src.engines, scripts: { start: "node dist/index.js", migrate: "node dist/cli.js migrate", "migrate:status": "node dist/cli.js migrate:status", "create-admin": "node dist/cli.js create-admin" },
              dependencies: src.dependencies };
            require("fs").writeFileSync(process.argv[1] + "/package.json", JSON.stringify(out, null, 2) + "\n");
          ' $OUT
          cd $OUT && npm install --omit=dev --no-audit --no-fund && cd ..
          zip -qr $OUT.zip $OUT
          ls -la $OUT.zip
      - uses: actions/upload-artifact@v6
        with:
          name: server-bundle
          path: likapcs-server-*.zip

  admin-windows:
    name: Admin installer (Windows x64)
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/likapcs-admin/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Stage server runtime (Node.js + PostgreSQL + server bundle)
        shell: pwsh
        run: ./scripts/stage-runtime.ps1
      - name: Build signed installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { Write-Error "TAURI_SIGNING_PRIVATE_KEY secret is missing - updates must be signed"; exit 1 }
          pnpm --filter @likapcs/admin tauri build --ci
      - name: Collect artifacts
        shell: pwsh
        run: |
          $dir = "apps/likapcs-admin/src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem "$dir/*-setup.exe" | Select-Object -First 1
          $sig = Get-ChildItem "$dir/*-setup.exe.sig" | Select-Object -First 1
          if (-not $exe -or -not $sig) { Get-ChildItem -Recurse apps/likapcs-admin/src-tauri/target/release/bundle; Write-Error "installer or signature not found"; exit 1 }
          New-Item -ItemType Directory -Force out | Out-Null
          # Published under the stable name only; the signature covers the file content, not its name.
          Copy-Item $exe.FullName out/LIKApcs-Setup.exe
          Copy-Item $sig.FullName out/LIKApcs-Setup.exe.sig
          Get-ChildItem out
      - uses: actions/upload-artifact@v6
        with:
          name: admin-installer
          path: out/*

  client-windows:
    name: Client installer (Windows x64)
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/likapcs-client/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @likapcs/client test
      - name: Build signed installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { Write-Error "TAURI_SIGNING_PRIVATE_KEY secret is missing - updates must be signed"; exit 1 }
          pnpm --filter @likapcs/client tauri build --ci
      - name: Collect artifacts
        shell: pwsh
        run: |
          $dir = "apps/likapcs-client/src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem "$dir/LIKApcs-Client_*-setup.exe" | Select-Object -First 1
          $sig = Get-ChildItem "$dir/LIKApcs-Client_*-setup.exe.sig" | Select-Object -First 1
          if (-not $exe -or -not $sig) { Get-ChildItem -Recurse apps/likapcs-client/src-tauri/target/release/bundle; Write-Error "client installer or signature not found"; exit 1 }
          New-Item -ItemType Directory -Force out-client | Out-Null
          Copy-Item $exe.FullName out-client/LIKApcs-Client-Setup.exe
          Copy-Item $sig.FullName out-client/LIKApcs-Client-Setup.exe.sig
          Get-ChildItem out-client
      - uses: actions/upload-artifact@v6
        with:
          name: client-installer
          path: out-client/*

  publish:
    name: Publish GitHub release
    needs: [verify, server-bundle, admin-windows, client-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v7
        with:
          pattern: '*-installer'
          path: artifacts
          merge-multiple: true
      - name: Checksums and updater manifests
        run: |
          VERSION=${{ needs.verify.outputs.version }}
          cd artifacts
          for f in LIKApcs-Setup.exe LIKApcs-Setup.exe.sig LIKApcs-Client-Setup.exe LIKApcs-Client-Setup.exe.sig; do
            [ -s "$f" ] || { ls -la; echo "::error::$f missing"; exit 1; }
          done
          sha256sum LIKApcs-Setup.exe LIKApcs-Client-Setup.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
          # Changelog section of this version = updater release notes.
          awk -v v="## [$VERSION]" 'index($0,v)==1{f=1;next} /^## \[/{if(f)exit} f' ../CHANGELOG.md > changelog.md
          [ -s changelog.md ] || echo "LIKApcs v$VERSION" > changelog.md
          node ../scripts/update-manifest.mjs "$VERSION" LIKApcs-Setup.exe "${{ github.repository }}" changelog.md latest.json
          node ../scripts/update-manifest.mjs "$VERSION" LIKApcs-Client-Setup.exe "${{ github.repository }}" changelog.md latest-client.json
          node -e 'for (const f of ["latest.json","latest-client.json"]) { const m = JSON.parse(require("fs").readFileSync(f, "utf8")); if (m.version !== process.argv[1] || !m.platforms["windows-x86_64"].signature) throw new Error(f + " invalid"); console.log(f, "->", m.platforms["windows-x86_64"].url); }' "$VERSION"
      - name: Release notes
        run: |
          VERSION=${{ needs.verify.outputs.version }}
          BASE="https://github.com/${{ github.repository }}/releases/download/v$VERSION"
          ADMIN_SHA=$(awk '/LIKApcs-Setup.exe$/{print $1}' artifacts/SHA256SUMS.txt)
          CLIENT_SHA=$(awk '/LIKApcs-Client-Setup.exe$/{print $1}' artifacts/SHA256SUMS.txt)
          {
            echo "## Download / Shkarko"
            echo
            echo "| Install on | File |"
            echo "| --- | --- |"
            echo "| **Main PC** (counter) — Admin app + LIKApcs Server, one installer · _PC-ja kryesore_ | [**LIKApcs-Setup.exe**]($BASE/LIKApcs-Setup.exe) |"
            echo "| **Every gaming PC** · _çdo PC lojërash_ | [**LIKApcs-Client-Setup.exe**]($BASE/LIKApcs-Client-Setup.exe) |"
            echo
            echo "Install the main PC first. The client finds the server on the local network by itself and asks for a one-time approval in the Admin app (_Gaming Stations → Pending devices_). Both files are version $VERSION, belong together and update themselves automatically from now on."
            echo
            echo "<details><summary>SHA-256</summary>"
            echo
            echo '```'
            echo "$ADMIN_SHA  LIKApcs-Setup.exe"
            echo "$CLIENT_SHA  LIKApcs-Client-Setup.exe"
            echo '```'
            echo
            echo "</details>"
            echo
            echo "---"
            echo
            cat artifacts/changelog.md
          } > notes.md
          cat notes.md
      - name: Create or update the release (two installers only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ needs.verify.outputs.version }}
          TAG="v$VERSION"
          FILES="artifacts/LIKApcs-Setup.exe artifacts/LIKApcs-Client-Setup.exe"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber --repo "${{ github.repository }}"
            gh release edit "$TAG" --repo "${{ github.repository }}" --title "LIKApcs v$VERSION" --notes-file notes.md --latest
          else
            gh release create "$TAG" $FILES --repo "${{ github.repository }}" --title "LIKApcs v$VERSION" --notes-file notes.md --latest
          fi
          # Nothing else may sit on the release page.
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | sort
      - name: Publish updater feed (branch release-feed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ needs.verify.outputs.version }}
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if ! git clone -q --depth 1 --branch release-feed "$REPO_URL" feed 2>/dev/null; then
            mkdir feed && git -C feed init -q -b release-feed && git -C feed remote add origin "$REPO_URL"
          fi
          cp artifacts/latest.json artifacts/latest-client.json artifacts/SHA256SUMS.txt feed/
          {
            echo "# LIKApcs update feed"
            echo
            echo "Machine-read by the LIKApcs auto-updater — **downloads are on the [releases page](https://github.com/${{ github.repository }}/releases/latest)**."
            echo
            echo "| File | Read by |"
            echo "| --- | --- |"
            echo "| \`latest.json\` | LIKApcs Admin / main-PC installer (and the server's Updates page) |"
            echo "| \`latest-client.json\` | LIKApcs-Client on the gaming PCs |"
            echo "| \`SHA256SUMS.txt\` | checksums of the current installers |"
            echo
            echo "Current version: **$VERSION**. Written by the Release workflow; do not edit by hand."
          } > feed/README.md
          cd feed
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "feed: v$VERSION" || { echo "feed unchanged"; exit 0; }
          git push -q origin release-feed
          echo "feed: https://raw.githubusercontent.com/${{ github.repository }}/release-feed/latest.json"
