# Release pipeline — triggered by a SemVer tag (v1.2.3). Produces a published GitHub release with:
#   • LIKApcs_<ver>_x64-setup.exe + .sig   Admin installer (NSIS) and its minisign update signature
#   • LIKApcs-Setup.exe                    same installer under a stable, human-friendly name
#   • latest.json                          update manifest read by the in-app updater
#   • likapcs-server-<ver>.zip             Server bundle (dist, migrations, deploy scripts, .env.example)
#   • SHA256SUMS.txt
#
# Required secret: TAURI_SIGNING_PRIVATE_KEY (minisign private key used for update signatures;
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD only if the key has one). Authenticode code signing of the
# installer is not configured yet (Windows SmartScreen shows "More info → Run anyway" on first install).
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

env:
  NODE_VERSION: 20
  PNPM_VERSION: 9.15.9

jobs:
  verify:
    name: Verify tag, versions and changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - id: v
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          ROOT=$(node -p "require('./package.json').version")
          ADMIN=$(node -p "require('./apps/likapcs-admin/package.json').version")
          SERVER=$(node -p "require('./apps/likapcs-server/package.json').version")
          CARGO=$(grep -m1 '^version' apps/likapcs-admin/src-tauri/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "tag=$VERSION root=$ROOT admin=$ADMIN server=$SERVER cargo=$CARGO"
          for v in "$ROOT" "$ADMIN" "$SERVER" "$CARGO"; do
            if [ "$v" != "$VERSION" ]; then echo "::error::package version $v does not match tag $VERSION"; exit 1; fi
          done
          grep -q "## \[$VERSION\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no entry for $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  server-bundle:
    name: Server bundle
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @likapcs/shared test
      - run: pnpm --filter @likapcs/server build
      - name: Assemble bundle
        run: |
          VERSION=${{ needs.verify.outputs.version }}
          OUT=likapcs-server-$VERSION
          mkdir -p $OUT/database
          cp -r apps/likapcs-server/dist $OUT/
          cp -r database/migrations $OUT/database/
          cp -r apps/likapcs-server/deploy $OUT/deploy
          cp .env.example $OUT/.env.example
          cp docs/development-setup.md $OUT/DEVELOPMENT.md
          cp apps/likapcs-server/deploy/README.md $OUT/README.md
          # Production package.json: runtime dependencies only (the shared package is bundled by tsup).
          node -e '
            const src = require("./apps/likapcs-server/package.json");
            delete src.dependencies["@likapcs/shared"];
            const out = { name: src.name, version: src.version, private: true, type: src.type, description: src.description,
              engines: src.engines, scripts: { start: "node dist/index.js", migrate: "node dist/cli.js migrate", "migrate:status": "node dist/cli.js migrate:status", "create-admin": "node dist/cli.js create-admin" },
              dependencies: src.dependencies };
            require("fs").writeFileSync(process.argv[1] + "/package.json", JSON.stringify(out, null, 2) + "\n");
          ' $OUT
          cd $OUT && npm install --omit=dev --no-audit --no-fund && cd ..
          zip -qr $OUT.zip $OUT
          ls -la $OUT.zip
      - uses: actions/upload-artifact@v6
        with:
          name: server-bundle
          path: likapcs-server-*.zip

  admin-windows:
    name: Admin installer (Windows x64)
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/likapcs-admin/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Stage server runtime (Node.js + PostgreSQL + server bundle)
        shell: pwsh
        run: ./scripts/stage-runtime.ps1
      - name: Build signed installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { Write-Error "TAURI_SIGNING_PRIVATE_KEY secret is missing - updates must be signed"; exit 1 }
          pnpm --filter @likapcs/admin tauri build --ci
      - name: Collect artifacts
        shell: pwsh
        run: |
          $dir = "apps/likapcs-admin/src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem "$dir/*-setup.exe" | Select-Object -First 1
          $sig = Get-ChildItem "$dir/*-setup.exe.sig" | Select-Object -First 1
          if (-not $exe -or -not $sig) { Get-ChildItem -Recurse apps/likapcs-admin/src-tauri/target/release/bundle; Write-Error "installer or signature not found"; exit 1 }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $exe.FullName out/
          Copy-Item $sig.FullName out/
          Copy-Item $exe.FullName out/LIKApcs-Setup.exe
          Get-ChildItem out
      - uses: actions/upload-artifact@v6
        with:
          name: admin-installer
          path: out/*

  publish:
    name: Publish GitHub release
    needs: [verify, server-bundle, admin-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Release notes from CHANGELOG
        run: |
          VERSION=${{ needs.verify.outputs.version }}
          awk -v v="## [$VERSION]" 'index($0,v)==1{f=1;next} /^## \[/{if(f)exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "LIKApcs v$VERSION" > notes.md
          cat notes.md
      - name: Build updater manifest (latest.json)
        run: |
          VERSION=${{ needs.verify.outputs.version }}
          cd artifacts
          EXE=$(ls *-setup.exe | grep -v '^LIKApcs-Setup.exe$' | head -1)
          SIG=$(cat "$EXE.sig")
          node -e '
            const [version, exe, sig, repo, notesFile] = process.argv.slice(1);
            const notes = require("fs").readFileSync(notesFile, "utf8").trim();
            const manifest = {
              version,
              notes,
              pub_date: new Date().toISOString(),
              platforms: {
                "windows-x86_64": {
                  signature: sig,
                  url: `https://github.com/${repo}/releases/download/v${version}/${encodeURIComponent(exe)}`,
                },
              },
            };
            require("fs").writeFileSync("latest.json", JSON.stringify(manifest, null, 2) + "\n");
          ' "$VERSION" "$EXE" "$SIG" "${{ github.repository }}" ../notes.md
          cat latest.json
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ needs.verify.outputs.version }}
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" artifacts/* --repo "${{ github.repository }}" --title "LIKApcs v$VERSION" --notes-file notes.md --latest
          fi
